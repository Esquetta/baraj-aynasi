name: Health check

on:
  schedule:
    - cron: "17 20 * * *" # after the day's runs, which GitHub can delay by hours
  workflow_dispatch:
    inputs:
      test_alert:
        description: Open a test issue to check that alerts arrive
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Check and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/health.py ${{ inputs.test_alert && '--test-alert' || '' }}
