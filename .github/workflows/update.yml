name: Update estimates

on:
  schedule:
    - cron: "30 5 * * *" # 08:30 Istanbul time, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Measure new Sentinel-2 scenes
        run: uv run python scripts/update.py
      - name: Rebuild page
        run: uv run python scripts/build_site.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- results site; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results site
          git commit -m "Update estimates with new Sentinel-2 scenes"
          git push
