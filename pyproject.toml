[project]
name = "baraj-aynasi"
version = "0.1.0"
description = "Satellite estimates of Istanbul reservoir occupancy from Sentinel-2 water surface area, with error bars."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furkan Tasci" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "planetary-computer>=1.0.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.urls]
Homepage = "https://esquetta.github.io/baraj-aynasi/"
Repository = "https://github.com/Esquetta/baraj-aynasi"

[project.optional-dependencies]
harvest = [
    "playwright>=1.64.1",
]
unet = [
    "torch>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
